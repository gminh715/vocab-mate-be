[project]
name = "vocab-mate-backend-python"
version = "0.1.0"
description = "High performance Python backend for Vocab Mate learning platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.15.0",
    "cloudinary>=1.46.2",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fsrs>=6.3.2",
    "google-genai>=2.23.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "nltk>=3.10.3",
    "pwdlib[bcrypt]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042", "UP046", "UP047", "BLE001", "B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
